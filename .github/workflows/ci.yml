---
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в тот же PR отменяет ещё бегущий запуск по предыдущему коммиту —
# не тратим минуты раннера на заведомо устаревший код.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # high/critical, не дефолтный low — low/moderate у транзитивных dev-зависимостей
      # (eslint-тулинг и т.п.) исторически оказывались шумом без реального вектора
      # эксплуатации в этом приложении, см. риск-триаж в Obsidian (npm audit: 38 → 0).
      # Блокировать PR на них означало бы гнать --force не глядя ради зелёной галочки.
      - run: npm audit --audit-level=high

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # test/globalSetup.ts качает бинарь mongod под mongodb-memory-server при первом
      # запуске (~100МБ) — кешируем между запусками по версии пакета из package-lock.json,
      # иначе каждый CI-прогон заново тянет его из сети (медленнее и менее надёжно).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Интеграционные тесты сами поднимают эфемерный MongoDB (mongodb-memory-server) и не
      # трогают Redis (email.queue.ts намеренно не создаёт соединение в NODE_ENV=test, см.
      # комментарий там) — внешние сервисы раннеру не нужны.
      - run: npm test

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # openapi:export импортирует src/config (нужен для сборки документа) — тот же набор
      # обязательных без дефолта переменных, что и в test/setupTestEnv.ts, значения не
      # используются ни для чего, кроме прохождения валидации схемы конфига.
      - run: npm run openapi:export
        env:
          JWT_SECRET: ci-fake-jwt-secret
          PASSWORD_PEPPER: ci-fake-password-pepper-not-a-real-secret-32plus
          GOOGLE_CLIENT_ID: ci-fake-google-client-id
          GOOGLE_CLIENT_SECRET: ci-fake-google-client-secret
          GITHUB_CLIENT_ID: ci-fake-github-client-id
          GITHUB_CLIENT_SECRET: ci-fake-github-client-secret
      # Если openapi.json в репозитории разошёлся с тем, что реально генерируют текущие
      # zod-схемы (кто-то поменял схему и забыл перегенерировать файл) — PR не должен
      # молча проезжать с устаревшей спекой, на которую опирается кодоген типов на lms-web.
      - run: git diff --exit-code openapi.json
